name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: bun install --frozen-lockfile
      - run: bun run build:ui
      - run: git diff --exit-code -- vendor app.js inbox.js progress.js visuals.js
      - run: bun run fmt:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run course validate courses/deepinfer
      - run: python3 tiny_engine.py test
      - run: bun install -g agent-browser@0.37.1
      - run: agent-browser install --with-deps
      - run: bun test tests
